  # SIMPLE: single-concept queries (should NOT decompose)
  # -----------------------------------------------------------------------
  - id: "q001"
    category: simple
    query: "What are the VM-20 reserve requirements?"
    expected_docs: ["VM-20"]
    required_concepts: ["deterministic reserve", "stochastic reserve"]
    forbidden_concepts: ["Solvency II"]
    min_citations: 1

