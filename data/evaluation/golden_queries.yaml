# Golden queries for RAG pipeline evaluation.
# Each query specifies expected retrieval behavior and response content.
#
# Categories:
#   simple       — single-concept, single-pass retrieval
#   comparison   — triggers query decomposition (compare/contrast)
#   aggregation  — triggers query decomposition (across/all/summarize)
#   formula      — should retrieve table/formula elements
#   section_span — answer requires multiple chunks from same section
#   edge_case    — off-topic, ambiguous, or adversarial

queries:
