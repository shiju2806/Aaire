# Infrastructure, Server, and Operational Configuration

server:
  host: "0.0.0.0"
  port: 8000
  cors_origins:
    - "https://aaire.xyz"
    - "https://www.aaire.xyz"
    - "http://localhost:3000"
    - "http://localhost:5173"

qdrant:
  collection_name: "aaire-documents"
  # url and api_key read from QDRANT_URL / QDRANT_API_KEY env vars

redis:
  host: ${REDIS_HOST:-localhost}
  port: 6379
  session_ttl_hours: 2

auth:
  algorithm: HS256
  access_token_expire_hours: 8

timeouts:
  citation_analysis_seconds: 30
  extraction_seconds: 300
  llm_retry_max: 2
  cache_ttl_hours: 24

paths:
  upload_dir: data/uploads
  analytics_dir: data/analytics
  taxonomy_dir: data/taxonomies
  feedback_dir: data/feedback

upload:
  max_size_mb: 100
  allowed_extensions:
    - ".pdf"
    - ".docx"
    - ".pptx"
    - ".xlsx"
    - ".csv"
    - ".txt"
    - ".html"
    - ".htm"

token_limits:
  target_tokens: 30000
  chars_per_token: 4
  document_preview_length: 2000

elasticsearch:
  hosts: ["http://localhost:9200"]
  index_name: "aaire-documents"
  request_timeout: 30

external_apis:
  sec_edgar:
    base_url: https://data.sec.gov
    tickers_url: https://www.sec.gov/files/company_tickers.json
  xbrl:
    taxonomy_url: https://xbrl.us/data/taxonomies/us-gaap/2024/concepts
