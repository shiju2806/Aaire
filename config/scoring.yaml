# Scoring, Thresholds, and Weighting Configuration
# All relevance scoring, quality validation, and conversation intelligence params.

relevance:
  # Query-type-specific scoring weights
  query_type_weights:
    specific_reference:
      exact_match: 0.6
      semantic: 0.2
      context: 0.1
      entity_coverage: 0.1
    conceptual:
      exact_match: 0.2
      semantic: 0.6
      context: 0.1
      entity_coverage: 0.1
    comparison:
      exact_match: 0.2
      semantic: 0.4
      context: 0.1
      entity_coverage: 0.3
    procedural:
      exact_match: 0.3
      semantic: 0.3
      context: 0.1
      entity_coverage: 0.3
    contextual:
      exact_match: 0.1
      semantic: 0.2
      context: 0.6
      entity_coverage: 0.1

  # Weight bounds for dynamic adjustment
  weight_bounds:
    exact_match: { min: 0.1, max: 0.8 }
    semantic: { min: 0.2, max: 0.7 }
    context: { min: 0.05, max: 0.6 }
    entity_coverage: { min: 0.05, max: 0.4 }

  # Boost thresholds
  boost:
    high_specificity: 0.8
    entity_match: 0.3
    domain_alignment: 0.2
    asc_code_exact_match: 0.5

  # Specificity score boundaries
  specificity:
    high_threshold: 0.7
    low_threshold: 0.3

  # Entity match score tiers
  entity_scoring:
    full_match: 0.3
    partial_match: 0.25
    weak_match: 0.15

  # Domain alignment scores
  domain_alignment:
    strong: 0.5
    moderate: 0.3

quality:
  # Unified quality validator weights
  weights:
    semantic_score: 0.3
    grounding_score: 0.4
    hallucination_penalty: 0.2
    openai_score: 0.1

  # Confidence thresholds
  confidence_threshold: 0.8
  adaptive_threshold_bounds:
    min: 0.25
    max: 0.8

  # Self-correction
  max_correction_iterations: 3
  correction_confidence_threshold: 0.8

conversation:
  # Message importance scoring weights
  importance_weights:
    question_boost: 0.3
    calculation_boost: 0.4
    number_boost: 0.3
    regulatory_boost: 0.2
    short_message_penalty: 0.8
    max_importance: 2.0

  # Memory compression settings
  compression:
    max_messages_before_compression: 15
    max_compressed_summaries: 3
    compression_ratio: 0.3
    max_context_tokens: 2000
    recent_messages_limit: 10
    content_truncation_short: 200
    content_truncation_long: 300

retrieval:
  # Document retrieval limits
  doc_limit: 20
  confidence_early_exit: 0.90

  # Hybrid search weights
  vector_weight: 0.6
  keyword_weight: 0.4

  # Default similarity threshold (used when model not found in per-model config)
  default_similarity_threshold: 0.3

  # Per-model similarity thresholds (keyed by embedding model name from llm.yaml)
  # text-embedding-3-large (3072-dim) produces lower cosine scores than older models.
  # Swap embedding model → update or add a new section here. No Python changes needed.
  similarity_thresholds:
    text-embedding-3-large:
      specific: 0.35
      general: 0.25
      neutral: 0.30
    text-embedding-3-small:
      specific: 0.45
      general: 0.35
      neutral: 0.40
    _default:
      specific: 0.35
      general: 0.25
      neutral: 0.30

reranking:
  # Cross-encoder reranking after retrieval
  enabled: true
  cross_encoder_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  max_content_length: 512        # Truncate content for cross-encoder input
  # Relative-gap reranking: always keep min_keep results, drop additional results
  # whose score is more than max_score_gap below the best. This uses the cross-encoder's
  # strength (relative ordering via score gaps) rather than brittle absolute thresholds.
  # MiniLM-L-6 logits range ~[-12, +10]; structured content (org charts, tables) scores
  # deeply negative even when relevant — absolute thresholds would wrongly filter them.
  min_keep: 5           # Always keep at least this many results after reranking
  max_score_gap: 15.0   # Drop results whose score is more than this below the best

extraction:
  # Smart router thresholds
  pattern_threshold: 0.8
  light_llm_threshold: 0.6
  full_llm_threshold: 0.4
  default_confidence_threshold: 0.7

  # Circuit breaker
  circuit_breaker:
    failure_threshold: 5
    timeout_seconds: 60

  # Callout/important element boost
  callout_boost: 1.3
